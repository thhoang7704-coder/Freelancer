
version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres_db

    restart: always

    environment:
      POSTGRES_DB: freelancer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: hoang7704/freelancer-be:latest

    container_name: freelancer_backend

    restart: always

    depends_on:
      - postgres

    ports:
      - "8082:8082"

    env_file:
      - .env

    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/freelancer

    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json

  frontend:
    image: hoang7704/freelancer-fe:latest

    container_name: freelancer_frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  postgres_data:

